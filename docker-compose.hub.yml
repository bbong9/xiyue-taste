# 汐乐容器（懂你 + NAS 下载）。任何能跑 Docker 的 NAS 都能用。
#
# 只需要改下面一行：把 /volume1/music 换成你的音乐库在 NAS 上的真实路径。
# 然后在本文件所在的文件夹（文件夹名用英文）执行：
#   docker compose pull && docker compose up -d
# 再用浏览器打开 http://NAS的内网IP:8790 ，按面板上的提示填“连接设置”和“AI 设置”。
# 以后更新，还是上面那条命令。
x-music: &music /volume1/music

services:
  taste:
    container_name: xiyue-taste
    image: bbong9/xiyue-taste:latest
    pull_policy: always
    volumes:
      # 音乐库：只读，用来分析
      - { type: bind, source: *music, target: /music, read_only: true }
      # 同一个音乐库：可写，App 让 NAS 下的歌存进来（只新增，不改不删已有的歌）
      - { type: bind, source: *music, target: /downloads }
      # 容器自己的设置和分析结果，放在本文件夹下
      - ./data:/data
      - ./out:/out
    ports:
      - "8790:8790"
    cpus: "2.0"
    mem_limit: 2g
    restart: unless-stopped
