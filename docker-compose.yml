services:
  taste:
    container_name: xiyue-taste
    build: .
    image: xiyue-taste
    environment:
      TASTE_LLM_API_KEY: "${TASTE_LLM_API_KEY:-}"
      TASTE_LLM_BASE_URL: "${TASTE_LLM_BASE_URL:-https://api.siliconflow.cn/v1}"
      TASTE_LLM_MODEL: "${TASTE_LLM_MODEL:-deepseek-ai/DeepSeek-V3.2}"
      TASTE_ACCESS_TOKEN: "${TASTE_ACCESS_TOKEN:-}"
      TASTE_TRUSTED_NETWORK: "${TASTE_TRUSTED_NETWORK:-192.168.50.0/24}"
      TASTE_HOST_IP: "${TASTE_HOST_IP:-192.168.50.2}"
    volumes:
      - "${MUSIC_DIR}:/music:ro"
      - "./data:/data"
      - "${OUT_DIR}:/out"
      - "${DOWNLOAD_DIR:-./downloads}:/downloads"
    ports:
      - "0.0.0.0:8790:8790"
    cpus: "2.0"
    mem_limit: 2g
    restart: unless-stopped
